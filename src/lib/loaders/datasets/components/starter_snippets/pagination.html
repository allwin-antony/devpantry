<!--
  OpenSourceDataset: UIComponents
  Component: Accessible Pagination Bar
  License: MIT (Free for commercial and personal use)
  Standard: W3C WAI-ARIA Navigation Landmark
-->
<style>
  .pagination-nav {
    display: flex;
    justify-content: center;
    font-family: inherit;
    font-size: 0.875rem;
  }

  .pagination-list {
    display: flex;
    align-items: center;
    list-style: none;
    padding: 0;
    margin: 0;
    gap: 0.25rem;
    border: 1px solid #e2e8f0;
    border-radius: 0.5rem;
    padding: 0.25rem;
    background: #ffffff;
  }

  .pagination-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.25rem;
    height: 2.25rem;
    padding: 0 0.5rem;
    border-radius: 0.375rem;
    color: #475569;
    text-decoration: none;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
    user-select: none;
  }

  .pagination-link:hover:not([aria-disabled="true"]):not([aria-current="page"]) {
    background-color: #f1f5f9;
    color: #0f172a;
  }

  .pagination-link[aria-current="page"] {
    background-color: #2563eb;
    color: #ffffff;
    font-weight: 600;
  }

  .pagination-link[aria-disabled="true"] {
    color: #cbd5e1;
    pointer-events: none;
    cursor: not-allowed;
  }

  .pagination-ellipsis {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.25rem;
    color: #94a3b8;
  }
</style>

<nav class="pagination-nav" aria-label="Dataset page navigation">
  <ul class="pagination-list">
    <!-- Previous Page -->
    <li>
      <a href="?page=1" class="pagination-link" aria-label="Go to previous page" aria-disabled="true">
        &larr; Prev
      </a>
    </li>

    <!-- Page 1 (Current) -->
    <li>
      <a href="?page=1" class="pagination-link" aria-current="page" aria-label="Page 1">
        1
      </a>
    </li>

    <!-- Page 2 -->
    <li>
      <a href="?page=2" class="pagination-link" aria-label="Page 2">
        2
      </a>
    </li>

    <!-- Page 3 -->
    <li>
      <a href="?page=3" class="pagination-link" aria-label="Page 3">
        3
      </a>
    </li>

    <!-- Ellipsis -->
    <li>
      <span class="pagination-ellipsis" aria-hidden="true">&hellip;</span>
    </li>

    <!-- Last Page -->
    <li>
      <a href="?page=42" class="pagination-link" aria-label="Page 42">
        42
      </a>
    </li>

    <!-- Next Page -->
    <li>
      <a href="?page=2" class="pagination-link" aria-label="Go to next page">
        Next &rarr;
      </a>
    </li>
  </ul>
</nav>
