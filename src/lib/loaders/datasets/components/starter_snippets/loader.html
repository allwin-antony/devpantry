<style>
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* 1. Circular Dual-Ring Spinner */
  .spinner-circle {
    display: inline-block;
    width: 2rem;
    height: 2rem;
    border: 3px solid #e2e8f0;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* 2. Pulsing Dots Loader */
  .pulse-dots {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
  }
  .pulse-dots span {
    width: 0.5rem;
    height: 0.5rem;
    background-color: #2563eb;
    border-radius: 50%;
    animation: pulse 1.2s infinite ease-in-out both;
  }
  .pulse-dots span:nth-child(1) { animation-delay: -0.32s; }
  .pulse-dots span:nth-child(2) { animation-delay: -0.16s; }
  .pulse-dots span:nth-child(3) { animation-delay: 0s; }

  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* 3. Modern Shimmer Skeleton Card */
  .skeleton-card {
    border: 1px solid #e2e8f0;
    border-radius: 0.75rem;
    padding: 1.25rem;
    max-width: 20rem;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .skeleton-box {
    background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 0.375rem;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>

<!-- Spinner -->
<div role="status" aria-live="polite">
  <div class="spinner-circle"></div>
  <span class="sr-only">Loading content, please wait...</span>
</div>

<!-- Pulsing Dots -->
<div role="status" aria-live="polite" style="margin-top: 1.5rem;">
  <div class="pulse-dots">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <span class="sr-only">Updating dataset...</span>
</div>

<!-- Shimmer Skeleton Placeholder -->
<div class="skeleton-card" role="status" aria-live="polite" style="margin-top: 1.5rem;">
  <div class="skeleton-box" style="height: 10rem; width: 100%;"></div>
  <div class="skeleton-box" style="height: 1.25rem; width: 75%;"></div>
  <div class="skeleton-box" style="height: 0.875rem; width: 50%;"></div>
  <span class="sr-only">Loading item preview...</span>
</div>
