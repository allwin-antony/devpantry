<!--
  OpenSourceDataset: UIComponents
  Component: Accessible Native HTML5 <dialog> Modal
  License: MIT (Free for commercial and personal use)
  Standard: W3C WAI-ARIA Dialog Pattern
-->
<style>
  dialog.app-modal {
    padding: 0;
    border: none;
    border-radius: 0.75rem;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    max-width: 32rem;
    width: 90vw;
    background: #ffffff;
    color: #0f172a;
    font-family: inherit;
  }

  dialog.app-modal::backdrop {
    background-color: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(4px);
  }

  .modal-box {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    margin: 0;
    font-size: 1.125rem;
    font-weight: 600;
  }

  .modal-close-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 1.25rem;
    line-height: 1;
    color: #64748b;
    border-radius: 0.25rem;
    padding: 0.25rem;
  }
  .modal-close-btn:hover {
    color: #0f172a;
    background: #f1f5f9;
  }

  .modal-desc {
    margin: 0;
    color: #64748b;
    font-size: 0.875rem;
    line-height: 1.4;
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
    margin-top: 0.5rem;
  }
</style>

<!-- Modal Trigger Button -->
<button type="button" onclick="document.getElementById('demo-modal').showModal()">
  Open Accessible Modal
</button>

<!-- Accessible Modal Dialog -->
<dialog id="demo-modal" class="app-modal" aria-labelledby="modal-title" aria-describedby="modal-desc">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modal-title" class="modal-title">Confirm Account Deletion</h2>
      <button type="button" class="modal-close-btn" aria-label="Close dialog" onclick="document.getElementById('demo-modal').close()">✕</button>
    </div>
    <p id="modal-desc" class="modal-desc">
      Are you sure you want to proceed? This action cannot be undone and will permanently remove all associated datasets and workspace configurations.
    </p>
    <div class="modal-footer">
      <button type="button" onclick="document.getElementById('demo-modal').close()">Cancel</button>
      <button type="button" style="background:#dc2626;color:white;" onclick="handleConfirm()">Confirm Delete</button>
    </div>
  </div>
</dialog>

<script>
  // Close dialog on clicking backdrop outside modal content
  const modal = document.getElementById('demo-modal');
  modal.addEventListener('click', (e) => {
    const rect = modal.getBoundingClientRect();
    const isInDialog = (rect.top <= e.clientY && e.clientY <= rect.top + rect.height
      && rect.left <= e.clientX && e.clientX <= rect.left + rect.width);
    if (!isInDialog) {
      modal.close();
    }
  });

  function handleConfirm() {
    alert('Action confirmed.');
    modal.close();
  }
</script>
