<!--
  OpenSourceDataset: UIComponents
  Component: Responsive Product / Feature Card
  License: MIT (Free for commercial and personal use)
  Standard: Semantic HTML5 <article>
-->
<style>
  .product-card {
    border: 1px solid #e2e8f0;
    border-radius: 0.75rem;
    overflow: hidden;
    background: #ffffff;
    max-width: 20rem;
    font-family: inherit;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .product-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
  }

  .card-media {
    position: relative;
    background: #f8fafc;
    height: 12rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
  }

  .card-badge {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    background: #2563eb;
    color: #ffffff;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.25rem 0.5rem;
    border-radius: 9999px;
  }

  .card-body {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .card-category {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #64748b;
    font-weight: 600;
  }

  .card-title {
    margin: 0;
    font-size: 1.125rem;
    font-weight: 600;
    color: #0f172a;
    line-height: 1.3;
  }

  .card-desc {
    margin: 0;
    color: #64748b;
    font-size: 0.875rem;
    line-height: 1.4;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.5rem;
    padding-top: 0.75rem;
    border-top: 1px solid #f1f5f9;
  }

  .card-price {
    font-size: 1.25rem;
    font-weight: 700;
    color: #0f172a;
  }

  .card-action-btn {
    background-color: #0f172a;
    color: #ffffff;
    border: none;
    border-radius: 0.375rem;
    padding: 0.5rem 0.875rem;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .card-action-btn:hover {
    background-color: #334155;
  }
</style>

<article class="product-card">
  <div class="card-media">
    <span class="card-badge">Open Source</span>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect width="18" height="18" x="3" y="3" rx="2"></rect>
      <path d="M3 9h18"></path>
      <path d="M9 21V9"></path>
    </svg>
  </div>
  <div class="card-body">
    <span class="card-category">UI Components</span>
    <h3 class="card-title">Production Design System</h3>
    <p class="card-desc">
      Fully accessible, cross-browser responsive layout blocks built with modern CSS variables.
    </p>
    <div class="card-footer">
      <span class="card-price">Free (MIT)</span>
      <button type="button" class="card-action-btn">Inspect Code</button>
    </div>
  </div>
</article>
