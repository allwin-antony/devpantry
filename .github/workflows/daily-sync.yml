name: Scheduled API & MCP Sync

on:
  schedule:
    # Runs every 2 days at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts skips heavy postinstall downloads like imgly models
        run: npm ci --ignore-scripts

      - name: Sync Public APIs
        run: npm run sync-apis

      - name: Sync MCP Tools
        run: npm run sync-mcp

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/public-apis.json src/data/mcp-tools.json
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            # Note: No [skip ci] so Cloudflare detects the push and rebuilds the static export
            git commit -m "chore(data): automated sync of public APIs and MCP tools"
            git push origin HEAD:${{ github.ref_name }}
          fi
